<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lager - Elektro Krieg</title>
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --blue: #0b5fa5;
    --blue-dark: #084578;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1c2530;
    --muted: #6b7785;
    --border: #dde3e9;
    --warn-bg: #fff3cd;
    --warn-text: #7a5b00;
    --ok-bg: #d9f3e3;
    --ok-text: #14663a;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2 { margin: 0 0 .5em; }
  .screen[hidden], .view[hidden] { display: none !important; }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .auth-card { background: var(--card); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .auth-card label { display: block; margin: 12px 0; font-size: .9em; color: var(--muted); }
  .auth-card input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; }
  .btn { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-size: .95em; }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-danger { color: var(--danger); }
  .btn-small { padding: 5px 10px; font-size: .85em; }
  .btn-icon { background: none; border: none; font-size: 1.2em; cursor: pointer; }
  .link-btn { background: none; border: none; color: var(--blue); cursor: pointer; text-decoration: underline; padding: 0; }
  .error-text { color: var(--danger); min-height: 1.2em; font-size: .9em; }
  header.app-header { display: flex; align-items: center; justify-content: space-between; background: var(--blue); color: #fff; padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
  header.app-header nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header.app-header nav button { background: transparent; border: none; color: #cfe4f6; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .95em; }
  header.app-header nav button.active, header.app-header nav button:hover { background: rgba(255,255,255,.15); color: #fff; }
  .user-box { display: flex; align-items: center; gap: 10px; font-size: .85em; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; padding: 9px; border: 1px solid var(--border); border-radius: 8px; }
  select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
  .table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  .table th, .table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .92em; }
  .table thead { background: #eef2f5; }
  .row-warn { background: #fffaf0; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75em; margin-left: 6px; }
  .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge-info { background: #e1ecf7; color: var(--blue-dark); }
  .muted { color: var(--muted); font-size: .85em; }
  .empty { text-align: center; color: var(--muted); padding: 20px; }
  .checkbox { display: flex; align-items: center; gap: 6px; font-size: .9em; }
  .dialog-backdrop { position: fixed; inset: 0; background: rgba(20,30,40,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .dialog { background: #fff; border-radius: 12px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  .dialog-body { padding: 16px; }
  .dialog-body label { display: block; margin-bottom: 10px; font-size: .9em; color: var(--muted); }
  .dialog-body input, .dialog-body textarea, .dialog-body select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; font-family: inherit; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 14px 0; }
  .position-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .position-row .pos-desc { flex: 2; }
  .position-row .pos-qty { flex: 1; }
  .form-error { color: var(--danger); font-size: .9em; min-height: 1.2em; }
  .warning-box { background: var(--warn-bg); color: var(--warn-text); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: .9em; }
  .order-list { display: grid; gap: 10px; }
  .order-card { background: var(--card); border-radius: 10px; padding: 14px; cursor: pointer; border: 1px solid var(--border); }
  .order-card:hover { border-color: var(--blue); }
  .order-card.order-complete { border-color: var(--ok-text); }
  .order-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .position-checklist { display: grid; gap: 8px; margin: 12px 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); background: #1c2530; color: #fff; padding: 10px 18px; border-radius: 8px; opacity: 0; transition: all .25s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #update-banner { display: none; position: fixed; top: 0; left: 0; right: 0; background: #ffdd57; color: #4a3b00; padding: 8px; text-align: center; z-index: 200; }
</style>
</head>
<body>

<div id="update-banner">Neue Version verfuegbar. <button class="link-btn" id="update-reload">Jetzt aktualisieren</button></div>

<!-- LOGIN -->
<section class="screen center-screen" data-screen="login">
  <div class="auth-card">
    <h1>Lager Elektro Krieg</h1>
    <form id="login-form">
      <label>E-Mail <input type="email" id="login-email" required autocomplete="username"></label>
      <label>Passwort <input type="password" id="login-password" required autocomplete="current-password"></label>
      <div class="error-text" id="login-error"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Anmelden</button>
    </form>
    <p class="muted" style="margin-top:16px">Noch kein Konto? <button class="link-btn" id="show-register">Registrieren</button></p>
  </div>
</section>

<!-- REGISTER -->
<section class="screen center-screen" data-screen="register" hidden>
  <div class="auth-card">
    <h1>Konto erstellen</h1>
    <form id="register-form">
      <label>Name <input type="text" id="register-name" required autocomplete="name"></label>
      <label>E-Mail <input type="email" id="register-email" required autocomplete="username"></label>
      <label>Passwort (mind. 6 Zeichen) <input type="password" id="register-password" required minlength="6" autocomplete="new-password"></label>
      <div class="error-text" id="register-error"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Registrieren</button>
    </form>
    <p class="muted" style="margin-top:16px">Bereits registriert? <button class="link-btn" id="show-login">Anmelden</button></p>
  </div>
</section>

<!-- PENDING -->
<section class="screen center-screen" data-screen="pending" hidden>
  <div class="auth-card">
    <h1>Konto wartet auf Freischaltung</h1>
    <p>Ein Administrator muss dir zuerst eine Rolle (Buero oder Monteur) zuweisen, bevor du das Lagersystem nutzen kannst.</p>
    <button class="btn btn-logout" style="width:100%">Abmelden</button>
  </div>
</section>

<!-- APP -->
<section class="screen" data-screen="app" hidden>
  <header class="app-header">
    <nav>
      <button data-nav="lager" class="active">Lager</button>
      <button data-nav="auftraege">Auftraege</button>
      <button data-nav="verwaltung">Verwaltung</button>
    </nav>
    <div class="user-box">
      <span id="current-user-name"></span>
      <span class="badge badge-info" id="current-user-role"></span>
      <button class="btn btn-small btn-logout">Abmelden</button>
    </div>
  </header>
  <main>
    <section class="view" data-view="lager" id="view-lager"></section>
    <section class="view" data-view="auftraege" id="view-auftraege" hidden></section>
    <section class="view" data-view="verwaltung" id="view-verwaltung" hidden></section>
  </main>
  <!-- Liegt bewusst AUSSERHALB der view-Container: wenn Firestore-Live-
       Daten eine Liste neu rendern, soll ein offener Dialog nicht mit
       verschwinden (siehe app.js openXyzDialog-Funktionen). -->
  <div id="dialog-slot"></div>
</section>

<script src="firebase-config.js"></script>
<script type="module">
  import { initApp } from './app.js';
  initApp();

  if ('serviceWorker' in navigator && !window.__DISABLE_SW__) {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            document.getElementById('update-banner').style.display = 'block';
          }
        });
      });
    }).catch(() => {});
  }
  document.getElementById('update-reload').addEventListener('click', () => {
    navigator.serviceWorker.getRegistration().then((reg) => reg?.waiting?.postMessage('skipWaiting'));
    window.location.reload();
  });
</script>
</body>
</html>
